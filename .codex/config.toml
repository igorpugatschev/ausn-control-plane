[mcp_servers.socraticode]
command = "node"
args = ["-e", "process.env.TMP=process.env.TEMP=require('node:path').resolve('.local/socraticode/tmp'); const p=require('node:child_process').spawn('npx',['-y','socraticode@1.12.0'],{stdio:'inherit',shell:process.platform==='win32'}); p.on('exit',c=>process.exit(c??1));"]
startup_timeout_sec = 120
tool_timeout_sec = 600

[mcp_servers.socraticode.env]
QDRANT_MODE = "external"
QDRANT_URL = "http://127.0.0.1:17333"
QDRANT_COLLECTION_PREFIX = "ausn_qa_"
EMBEDDING_PROVIDER = "ollama"
EMBEDDING_MODEL = "nomic-embed-text"
OLLAMA_MODE = "external"
OLLAMA_URL = "http://127.0.0.1:11434"
SOCRATICODE_GLOBAL_CONFIG_DIR = "./.local/socraticode/context"

[mcp_servers.atlassian]
command = "node"
args = ["--env-file=.env", "tools/mcp-runtime/node_modules/mcp-remote/dist/proxy.js", "http://192.168.100.108:9871/mcp", "--transport", "http-only", "--silent", "--allow-http"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.atlassian.env]
MCP_REMOTE_CONFIG_DIR = ".local/mcp-auth/atlassian"

[mcp_servers.gitlab]
